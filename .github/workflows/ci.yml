name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  PYTHON_VERSION: "3.11"
  PROMETHEUS_METRICS: "false"
  AB_TEST_ENABLED: "false"
  SHADOW_MODE_ENABLED: "false"
  SAFETY_VERSION: "3.2.11"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy

      - name: Check formatting with Black
        run: black --check --diff src/

      - name: Check import sorting with isort
        run: isort --check-only --diff src/

      - name: Lint with flake8
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (venv)
        run: bash scripts/setup-dev-venv.sh

      - name: Run unit tests with coverage
        run: .venv/bin/python -m pytest tests/unit -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  characterization:
    name: Characterization Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      PIPELINE_MODE: combined
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (venv, includes cv for combined mode)
        run: INSTALL_CV=1 bash scripts/setup-dev-venv.sh

      - name: Run characterization tests
        run: .venv/bin/python -m pytest tests/characterization -v

  operational:
    name: Operational Profile Matrix
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (venv with CV for combined smoke)
        run: INSTALL_CV=1 bash scripts/setup-dev-venv.sh

      - name: Run offline operational suite
        run: .venv/bin/python -m pytest tests/operational -v -m "not integration"

      - name: Run offline integration subset
        run: .venv/bin/python -m pytest tests/integration -v -m "not integration"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies and scan
        run: |
          bash scripts/setup-dev-venv.sh
          source .venv/bin/activate
          pip install "safety==${SAFETY_VERSION}"
          safety check --full-report

  release-candidate:
    name: Release Candidate Verification
    runs-on: ubuntu-latest
    needs: [lint, test, operational, security, image-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v3

      - name: Run release candidate verification
        run: |
          chmod +x scripts/release-candidate-verify.sh
          INSTALL_CV=1 bash scripts/release-candidate-verify.sh

  docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test, characterization, operational]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Fraud API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile.api
          push: false
          tags: fraud-api:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build CV API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile.cv
          push: false
          tags: cv-api:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-scan:
    name: Image Security Scan
    runs-on: ubuntu-latest
    needs: docker-images
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Fraud API image for scan
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile.api
          push: false
          tags: fraud-api:${{ github.sha }}
          load: true

      - name: Build CV API image for scan
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/docker/Dockerfile.cv
          push: false
          tags: cv-api:${{ github.sha }}
          load: true

      - name: Scan Fraud API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fraud-api:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Scan CV API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cv-api:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

  build-docker:
    name: Push Main Image Gate
    runs-on: ubuntu-latest
    needs: image-scan
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Image scan gate passed
        run: echo "Docker images built and scanned successfully"

  integration-test:
    name: Integration Tests (opt-in live)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: false  # opt-in: requires live services; run locally with -m integration
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: bash scripts/setup-dev-venv.sh

      - name: Run integration tests
        run: |
          source .venv/bin/activate
          pytest tests/integration -v -m integration --tb=short
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  all-tests-pass:
    name: All Tests Pass
    runs-on: ubuntu-latest
    needs: [lint, test, characterization, operational, security, image-scan, release-candidate]
    steps:
      - name: All checks passed
        run: echo "All CI checks passed successfully!"
